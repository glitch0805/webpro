<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 - 수업 예제 완성</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600&display=swap" rel="stylesheet">
    <style>
        h1 { text-align: center; }
        .disp { width: 205px; height: 40px; margin-top: 3px; text-align: right; font-family: "Oxanium", sans-serif; font-size: 22pt; }
        input[type=button] { width: 50px; height: 50px; margin-top: 5px; text-align: center; vertical-align: middle; font-size: 14pt; cursor: pointer; }
        #calc { width: 220px; margin-left: auto; margin-right: auto; }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        // eval()을 대체하는 사칙연산 계산 함수 (연산자 우선순위 반영)
        function calculateExpression(expr) {
            // 숫자와 연산자(+, -, *, /)를 분리하여 배열로 추출
            let tokens = expr.match(/(\d+\.?\d*|\+|\-|\*|\/)/g);
            if (!tokens) return "";

            // 1단계: 곱셈(*)과 나눗셈(/) 먼저 처리
            for (let i = 0; i < tokens.length; i++) {
                if (tokens[i] === "*" || tokens[i] === "/") {
                    let prev = parseFloat(tokens[i - 1]);
                    let next = parseFloat(tokens[i + 1]);
                    if (tokens[i] === "/" && next === 0) return "Error";
                    let res = (tokens[i] === "*") ? (prev * next) : (prev / next);
                    tokens.splice(i - 1, 3, res); // 계산된 3개 요소를 결과값 1개로 치환
                    i--; // 배열 길이가 줄었으므로 인덱스 조정
                }
            }

            // 2단계: 덧셈(+)과 뺄셈(-) 순차 처리
            let result = parseFloat(tokens[0]);
            for (let i = 1; i < tokens.length; i += 2) {
                let op = tokens[i];
                let next = parseFloat(tokens[i + 1]);
                if (op === "+") result += next;
                else if (op === "-") result -= next;
            }
            return result;
        }

        $(document).ready(function(){
            // 숫자 버튼 클릭
            $(".num").click(function(){
                let cur = $("#disp2").val();
                let n = $(this).val();
                $("#disp2").val(cur + n);
            });

            // 연산자 및 '=' 버튼 클릭
            $(".op").click(function(){
                let cur = $("#disp2").val();
                let n = $(this).val();
                if (n != "=") {
                    // 수식이 비어있거나 마지막 글자가 이미 연산자인 경우 중복 입력 방지
                    if (cur === "" || /[\+\-\*\/]$/.test(cur)) return;
                    $("#disp2").val(cur + n);
                } else {
                    if (cur === "") return;
                    let result = calculateExpression(cur);
                    $("#disp1").val(cur + " =");
                    $("#disp2").val(result);
                }
            });

            // AC(초기화) 버튼 클릭
            $(".func").click(function(){
                $("#disp1").val("");
                $("#disp2").val("");
            });
        });
    </script>
</head>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="ac">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>
</body>
</html>
