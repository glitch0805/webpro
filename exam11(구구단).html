<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>구구단 과제</title>
</head>
<body>
    <h2>구구단 2~9단 출력</h2>
    
    <script>
        // 바깥쪽 반복문: 2단부터 9단까지 반복
        for (let i = 2; i <= 9; i++) {
            document.write("<h3>" + i + "단</h3>");
            
            // 안쪽 반복문: 1부터 9까지 곱해지는 수 반복
            for (let j = 1; j <= 9; j++) {
                // i와 j를 곱한 결과를 화면에 출력하고 줄바꿈(<br>) 적용
                document.write(i + " x " + j + " = " + (i * j) + "<br>");
            }
        }
    </script>
</body>
</html>
